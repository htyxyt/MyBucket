name: Autoupdate Scoop Manifests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write

concurrency:
  group: scoop-autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Update manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkver = Join-Path $env:USERPROFILE 'scoop\apps\scoop\current\bin\checkver.ps1'
          Get-ChildItem -Path .\bucket -Filter *.json | Sort-Object Name | ForEach-Object {
              Write-Host "Checking $($_.Name)"
              & $checkver $_.FullName -u
          }

      - name: Validate manifests
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\validate-manifests.ps1

      - name: Commit and push changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git status --short
          if (-not (git status --porcelain)) {
              Write-Host 'No manifest updates.'
              exit 0
          }

          git add bucket README.md tests .github
          git commit -m "chore: autoupdate scoop manifests"
          git push
